name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Publish an explicit allowlist, never the whole checkout: anything not
      # copied here stays unreachable on the live site. Missing file = failed
      # build, which is the loud failure we want.
      - name: Stage the files the site serves
        run: |
          mkdir -p _site/files/CV
          cp index.html 404.html styles.css robots.txt sitemap.xml google5691fe2aaf6adc32.html 91887649597bc5afc4bddf938a4b2ab1.txt _site/
          cp files/wonjin.jpg files/*.pdf _site/files/
          cp files/CV/CV.pdf _site/files/CV/
          echo "--- staged ---"
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
